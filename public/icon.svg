<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="중부워싱턴한인장로교회 성가대">
  <!--
    홈 화면 아이콘. 48px까지 줄어들어도 알아볼 수 있어야 하므로 요소는 셋뿐이다 —
    표지색 바탕, 펼친 악보, 8분음표 한 쌍. 색은 중앙성가 47집 표지색(#7B3F4A)에서 가져왔다.
    바깥 여백은 안드로이드 마스크(원·둥근사각)가 잘라도 음표가 살아남도록 넉넉히 뒀다.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E4A56" />
      <stop offset="1" stop-color="#6B3540" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- 펼친 악보 -->
  <g fill="none" stroke="#F5EDE6" stroke-linecap="round" opacity="0.5">
    <path d="M96 358 C 150 336, 210 336, 256 356" stroke-width="14" />
    <path d="M256 356 C 302 336, 362 336, 416 358" stroke-width="14" />
    <path d="M120 316 C 166 300, 214 300, 250 314" stroke-width="9" />
    <path d="M262 314 C 298 300, 346 300, 392 316" stroke-width="9" />
  </g>

  <!-- 8분음표 한 쌍 -->
  <g fill="#FFFFFF">
    <g transform="rotate(-20 176 268)">
      <ellipse cx="176" cy="268" rx="50" ry="38" />
    </g>
    <g transform="rotate(-20 326 236)">
      <ellipse cx="326" cy="236" rx="50" ry="38" />
    </g>
    <rect x="211" y="104" width="19" height="164" rx="9" />
    <rect x="361" y="80" width="19" height="156" rx="9" />
    <path d="M211 104 L380 80 L380 128 L211 152 Z" />
  </g>
</svg>
